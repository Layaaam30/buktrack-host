name: buktrack_web
description: BukTrack Web Application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^2.24.0
  # firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0

  # Routing
  go_router: ^12.1.3

  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  tabler_icons: ^2.5.0+1

  # Utilities
  intl: ^0.18.1
  crypto: ^3.0.3

  # HTTP & API
  http: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
