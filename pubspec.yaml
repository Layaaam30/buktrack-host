name: buktrack_web
description: BukTrack Web Application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0

  firebase_auth: ^6.1.2

  # Routing
  go_router: ^17.0.0

  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.2.2
  tabler_icons: ^2.5.0+1

  # Utilities
  intl: ^0.20.2
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1

  # HTTP & API
  http: ^1.1.2
  bcrypt: ^1.1.3
  fl_chart: ^1.1.1
  google_maps_flutter: ^2.14.0
  tutorial_coach_mark: ^1.3.3
  pdf: ^3.11.3
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logos/light-logo.svg
    - assets/images/logos/dark-logo.svg
    - assets/images/logos/favicon.png
    - assets/images/buktrack_logo.png
